name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Code Linting with Ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Execute End-to-End CLI Triage Smoke Test
        run: |
          python -m analyst_core.orchestrator --alert telemetry_fixtures/true_positive_ransomware.json --output reports/sample_ransomware_report.md
          cat reports/sample_ransomware_report.md
