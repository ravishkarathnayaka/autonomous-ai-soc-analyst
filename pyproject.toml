[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-soc-analyst"
version = "1.0.0"
description = "Autonomous Tier-1 AI SOC Analyst & Threat Investigation Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Autonomous SOC Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "networkx>=3.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["analyst_core*", "api*"]
exclude = ["tests*", "docker*", "telemetry_fixtures*", "reports*"]

[tool.ruff]
line-length = 100
target-version = "py311"

